# Training env for the toy SAE (sae-training Matryoshka backend). torch pinned cu126 -- the
# default cu130 wheel silently falls back to CPU on this 12.6 driver. Training and scoring both use the sae-training path, so one env can do both.
# `sae-training` is an editable sibling clone (../sae-training on the compute node).
[project]
name = "toysae"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.7.1",
    "sae-training",
    "numpy",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
sae-training = { path = "../sae-training", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
