# Server-side env for ~/toysae (pushed as pyproject.toml by toysae_remote.sh).
#
# CRITICAL: torch pinned to cu126 — the default cu130 wheel silently falls back
# to CPU on this driver (12.6). See SERVER.md.
#
# sae-lens is pinned to 5.x, NOT the >=6.5 that experiment_0 uses. The training
# fork (chanin/feature-hedging-paper) is built on 5.x internals that no longer
# exist in 6.x: sae_lens.training.training_sae, the three-argument
# training_forward_pass, and a LanguageModelSAERunnerConfig that still carries
# l1_coefficient/normalize_sae_decoder at the top level. This is why training
# and measurement are two environments rather than one.
[project]
name = "toysae"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.7.1",
    "sae-lens==5.10.2",
    "transformer-lens>=2.11,<3",
    "numpy",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
