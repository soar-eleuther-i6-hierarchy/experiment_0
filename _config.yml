# GitHub Pages build configuration.
#
# One job: keep the ~10 MB of JSON that nothing serves out of the built site.
#
# The 6 August build took 10.6 minutes against Pages' 10-minute limit, and the push
# after it timed out before succeeding on retry. Of the 17.3 MB Jekyll was copying,
# 10.8 MB is the JSON listed below, and no published page fetches any of it:
# feature_labels.json is a build INPUT (labels are inlined into the dashboards at
# generation time), npedia_labels_cache.json is fetch_labels.py's scratch file, and
# second_pass.json is read by the report generators, not by a browser. Excluding
# them roughly halves what the site has to build and serve.
#
# `exclude` removes files from the SITE, not from the repository. Every file below
# is still committed, still cloned, still exactly what the pipeline reads. It only
# stops being served over HTTP, which nothing was using it for.
#
# Deliberately NOT excluded:
#   - outputs/assets/plotly.min.js -- every dashboard links to it at runtime.
#   - *.py and the metrics/ reporting/ validation/ directories. They ARE part of the
#     published site: the READMEs link to source files by relative path and each
#     directory serves its own README as a page. Verified live before writing this.
#   - outputs/**/metrics_report.json and qualitative_check.json. Small, and they are
#     the machine-readable form of published results -- worth a stable URL.
#
# .nojekyll is deliberately not used instead. Directory URLs -- outputs/,
# outputs/layer_06/, validation/ -- are what the nav's layer pills and the READMEs
# link to, and they resolve only because Jekyll renders each directory's README.md
# as its index. Turning Jekyll off would 404 every one of them.
#
# When a layer is added, add its two label files here too.

exclude:
  - outputs/layer_03/feature_labels.json
  - outputs/layer_06/feature_labels.json
  - outputs/layer_12/feature_labels.json
  - outputs/layer_18/feature_labels.json
  - outputs/layer_24/feature_labels.json
  - outputs/layer_03/npedia_labels_cache.json
  - outputs/layer_06/npedia_labels_cache.json
  - outputs/layer_12/npedia_labels_cache.json
  - outputs/layer_18/npedia_labels_cache.json
  - outputs/layer_24/npedia_labels_cache.json
  - outputs/layer_06/second_pass.json
